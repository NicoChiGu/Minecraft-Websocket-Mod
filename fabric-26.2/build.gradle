plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

base {
    archivesName = 'mcws-26.2'
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.157.0+26.2'

    implementation project(':core')
    include project(':core')
    include 'org.java-websocket:Java-WebSocket:1.5.7'
}

processResources {
    inputs.property 'version', project.version
    from('../fabric-common/src/main/resources/assets') {
        into 'assets'
    }
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}
