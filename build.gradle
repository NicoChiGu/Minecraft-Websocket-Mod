def resolvedModVersion = providers.gradleProperty('modVersion')
    .orElse(providers.environmentVariable('MOD_VERSION'))
    .orElse('0.1.0')
    .get()

allprojects {
    group = 'dev.terata.mctunnel'
    version = resolvedModVersion

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
